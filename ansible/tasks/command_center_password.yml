---
- name: Inspect the existing application password file without following links
  ansible.builtin.stat:
    path: "{{ ccng_config_dir }}/auth.json"
    follow: false
    get_checksum: false
  register: ccng_auth

- name: Preserve only a private password file owned by the application user
  ansible.builtin.assert:
    that:
      - >-
        not ccng_auth.stat.exists or
        (ccng_auth.stat.isreg | default(false) and
         not (ccng_auth.stat.islnk | default(false)) and
         ccng_auth.stat.uid == ccng_user_uid | int and
         ccng_auth.stat.mode in ['0600', '0400'])
    fail_msg: Existing authentication must be a private regular file owned by the application user.
    quiet: true

- name: Require a supplied protected password for first installation only
  ansible.builtin.assert:
    that:
      - command_center_password is defined
      - command_center_password is string
      - command_center_password | length >= 12
      - command_center_password | length <= 4096
      - "'\n' not in command_center_password"
      - "'\r' not in command_center_password"
    fail_msg: Supply a new application password through protected Ansible variables.
    quiet: true
  when: not ccng_auth.stat.exists

- name: Create the application password hash without putting the password in arguments
  ansible.builtin.command:
    argv:
      - node
      - "{{ ccng_install_dir }}/server/password.mjs"
      - --stdin
    stdin: "{{ command_center_password }}"
    stdin_add_newline: false
    creates: "{{ ccng_config_dir }}/auth.json"
  when: not ccng_auth.stat.exists
  no_log: true

- name: Validate the retained or newly created authentication file
  ansible.builtin.command:
    argv:
      - node
      - --input-type=module
      - --eval
      - >-
        const {pathToFileURL} = await import('node:url');
        const {loadPassword} = await import(pathToFileURL(process.argv[1]));
        await loadPassword(process.argv[2]);
      - "{{ ccng_install_dir }}/server/auth.mjs"
      - "{{ ccng_config_dir }}/auth.json"
  changed_when: false
  no_log: true
