# SYNTHETIC EXAMPLE ONLY. Store real settings in the private Vault companion.
command_center_user: example_operator
# Default agent workspace is <account-home>/ccng-wd, created on first setup.
# command_center_project_dir: /home/example_operator/projects/existing-project
command_center_repository: git@github.com:EXAMPLE_OWNER/command-center-ng.git
command_center_revision: main
# Defaults: localhost:4242; preserve existing Codex/Beads login/profile/services.
# command_center_codex_home: /home/example_operator/.codex
command_center_public_origin: https://command-center.example.invalid
# Provision trusted HTTPS and Basic authentication on every proxy route first.
# The playbook verifies the unauthenticated frontend before managed writes.
command_center_first_password_setup: htpasswd-proxy
# command_center_manage_packages: true
# command_center_force_install: false
# Create the fresh application password through the protected browser opening.
# Existing application authentication is preserved; no setup code is used.
